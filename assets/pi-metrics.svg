<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14151f" />
      <stop offset="100%" stop-color="#090a10" />
    </linearGradient>

    <!-- Raspberry Berry Gradient -->
    <linearGradient id="berryGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="60%" stop-color="#be123c" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>

    <!-- Leaf Green Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>

    <!-- Telemetry Pulse Glow Gradient -->
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base Container -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="#27272a" stroke-width="6" />

  <!-- Subtle Circuit Traces in Background -->
  <g stroke="#3f3f46" stroke-width="3" stroke-linecap="round" opacity="0.45" fill="none">
    <path d="M 80 120 L 140 120 L 170 150" />
    <circle cx="80" cy="120" r="5" fill="#3f3f46" />
    <path d="M 432 120 L 372 120 L 342 150" />
    <circle cx="432" cy="120" r="5" fill="#3f3f46" />
    <path d="M 70 380 L 130 380 L 160 350" />
    <circle cx="70" cy="380" r="5" fill="#3f3f46" />
    <path d="M 442 380 L 382 380 L 352 350" />
    <circle cx="442" cy="380" r="5" fill="#3f3f46" />
  </g>

  <!-- Raspberry Pi Leaves -->
  <g fill="url(#leafGrad)">
    <!-- Left Leaf -->
    <path d="M 256 128 C 220 70 148 94 168 148 C 182 178 226 162 256 142 Z" />
    <!-- Right Leaf -->
    <path d="M 256 128 C 292 70 364 94 344 148 C 330 178 286 162 256 142 Z" />
    <!-- Center Stem / Calyx -->
    <path d="M 246 114 C 252 82 260 82 266 114 C 274 136 238 136 246 114 Z" />
    <!-- Center Bottom Leaf -->
    <path d="M 256 140 C 238 162 274 162 256 140 Z" />
  </g>

  <!-- Raspberry Pi Drupelets (Berry Body) -->
  <g fill="url(#berryGrad)">
    <!-- Top Row -->
    <circle cx="216" cy="186" r="32" />
    <circle cx="296" cy="186" r="32" />
    <!-- Center Drupelet -->
    <circle cx="256" cy="226" r="34" />
    <!-- Second Row -->
    <circle cx="180" cy="242" r="33" />
    <circle cx="332" cy="242" r="33" />
    <!-- Third Row -->
    <circle cx="212" cy="294" r="33" />
    <circle cx="300" cy="294" r="33" />
    <!-- Fourth Row -->
    <circle cx="178" cy="314" r="30" />
    <circle cx="334" cy="314" r="30" />
    <!-- Bottom Row -->
    <circle cx="232" cy="358" r="28" />
    <circle cx="280" cy="358" r="28" />
    <!-- Bottom Tip -->
    <circle cx="256" cy="396" r="22" />
  </g>

  <!-- Highlights on Berries -->
  <g fill="#fda4af" opacity="0.45">
    <circle cx="206" cy="176" r="9" />
    <circle cx="286" cy="176" r="9" />
    <circle cx="246" cy="216" r="10" />
    <circle cx="170" cy="232" r="9" />
    <circle cx="322" cy="232" r="9" />
    <circle cx="202" cy="284" r="9" />
    <circle cx="290" cy="284" r="9" />
    <circle cx="224" cy="350" r="7" />
    <circle cx="272" cy="350" r="7" />
  </g>

  <!-- Hardware Tech Circle / Badge Ring -->
  <circle cx="256" cy="256" r="184" fill="none" stroke="#27272a" stroke-width="3" stroke-dasharray="14 10" opacity="0.6" />

  <!-- Real-Time Telemetry ECG / Metrics Waveform Overlay across bottom -->
  <g filter="url(#glow)">
    <path d="M 64 360 L 150 360 L 176 332 L 202 388 L 226 312 L 254 416 L 282 284 L 308 380 L 332 344 L 358 360 L 448 360"
          fill="none" stroke="url(#pulseGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Pulse Points / Indicator LEDs -->
  <circle cx="282" cy="284" r="6" fill="#38bdf8" />
  <circle cx="282" cy="284" r="12" fill="#38bdf8" opacity="0.35" />
  <circle cx="448" cy="360" r="5" fill="#818cf8" />
</svg>
