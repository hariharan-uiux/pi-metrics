name: Build Windows Installer

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Package Windows Setup Installer (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies & Build Web Assets
        run: |
          npm install
          npm run build

      - name: Install Python Packaging Tools
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pywebview

      - name: Build Standalone Application with PyInstaller
        run: |
          pyinstaller --clean --distpath build_exe --workpath build_tmp pi-metrics.spec -y

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress -y

      - name: Compile Inno Setup Installer (.EXE)
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PiMetrics-Setup-x64
          path: setup_output/PiMetrics-Setup-x64.exe
          if-no-files-found: error

      - name: Create GitHub Release (on tag or manual dispatch)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: setup_output/PiMetrics-Setup-x64.exe
          draft: false
          prerelease: false
          generate_release_notes: true
